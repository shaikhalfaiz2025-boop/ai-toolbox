<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - AI Toolbox</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(109,61,245,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(141,104,255,0.16),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #faf9ff,
                    #efedfa
                );
        }

        .card {

            width: min(430px, 100%);

            padding: 40px;

            background: rgba(255,255,255,0.95);

            border: 1px solid rgba(109,61,245,0.12);

            border-radius: 26px;

            box-shadow:
                0 25px 70px rgba(43,25,95,0.14),
                inset 0 1px 0 rgba(255,255,255,0.9);

            backdrop-filter: blur(15px);
        }

        .logo {

            text-align: center;

            color: #6d3df5;

            font-size: 26px;

            font-weight: 900;

            margin-bottom: 25px;
        }

        h1 {

            text-align: center;

            color: #171522;

            font-size: 30px;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #777284;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        label {

            display: block;

            color: #393544;

            font-size: 14px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd8ea;

            border-radius: 13px;

            outline: none;

            font-size: 15px;

            background: white;

            transition: 0.25s ease;
        }

        input:focus {

            border-color: #6d3df5;

            box-shadow:
                0 0 0 4px
                rgba(109,61,245,0.08);
        }

        .reset-button {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #6d3df5,
                    #8d68ff
                );

            color: white;

            font-size: 15px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 12px 28px
                rgba(109,61,245,0.24);

            transition: 0.25s ease;
        }

        .reset-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 17px 35px
                rgba(109,61,245,0.30);
        }

        .reset-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }

        .message {

            display: none;

            margin-top: 17px;

            padding: 13px;

            border-radius: 11px;

            text-align: center;

            background: #f0ebff;

            color: #542bc7;

            font-size: 13px;

            font-weight: 800;

            line-height: 1.5;
        }

        .message.error {

            background: #fff0f0;

            color: #c62828;
        }

        .login-link {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #6d3df5;

            text-decoration: none;

            font-size: 14px;

            font-weight: 800;
        }

        .login-link:hover {

            text-decoration: underline;
        }

        .home-link {

            display: block;

            text-align: center;

            margin-top: 14px;

            color: #777284;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;
        }

        .home-link:hover {

            color: #6d3df5;
        }

        @media (max-width: 500px) {

            .card {

                padding: 28px 22px;

                border-radius: 22px;
            }

            h1 {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>


<div class="card">

    <div class="logo">
        ⚡ AI Toolbox
    </div>


    <h1>
        Forgot Password?
    </h1>


    <p class="subtitle">
        Enter your email address and we'll
        help you reset your password.
    </p>


    <label for="email">
        Email Address
    </label>


    <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
    >


    <button
        type="button"
        id="resetButton"
        class="reset-button"
        onclick="resetPassword()"
    >
        Send Reset Link
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="login.html"
        class="login-link"
    >
        ← Back to Login
    </a>


    <a
        href="index.html"
        class="home-link"
    >
        Back to AI Toolbox
    </a>

</div>


<script>

async function resetPassword() {

    const emailInput =
        document.getElementById("email");

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("resetButton");


    const email =
        emailInput.value.trim();


    message.style.display = "none";

    message.classList.remove("error");


    if (!email) {

        message.style.display = "block";

        message.classList.add("error");

        message.textContent =
            "Please enter your email address.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Sending...";


    try {

        const response =
            await fetch(
                "/api/auth/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Something went wrong."
            );
        }


        message.style.display = "block";

        message.classList.remove("error");

        message.textContent =
            data.message ||
            "Password reset request received successfully.";


        emailInput.value = "";


    } catch (error) {

        console.error(
            "Forgot password error:",
            error
        );


        message.style.display = "block";

        message.classList.add("error");

        message.textContent =
            error.message ||
            "Could not process your request.";
    }


    button.disabled = false;

    button.textContent =
        "Send Reset Link";
}

</script>


</body>

</html>
